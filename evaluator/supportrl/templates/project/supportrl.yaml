# supportrl.yaml -- one file describes your support desk to the evaluator.
# Generated by `supportrl init`. Every key is documented here; see recipe/ for how to fill it.
name: __NAME__
title: Kestrel Parcel support triage      # replace with your company / product

# Optional: the license of your data, copied into site exports. Keep your code license separate.
# data_license: {name: CC-BY-4.0, url: https://creativecommons.org/licenses/by/4.0/, attribution: Your Co}

# ---------------------------------------------------------------------------- policy pack
policy_pack: policies.md                  # your policies, in markdown; appended to the prompt
policy_id_pattern: '\*\*([A-Z]{3}-\d{2}) —'   # regex with one group that finds IDs in the pack
policy_id_format: '^[A-Z]{3}-\d{2}$'          # what a well-formed ID looks like in labels

# ---------------------------------------------------------------------------- model input
prompt:
  instructions: prompt.md                 # output contract + vocab semantics; pack appended after
  version: prompt-v1                      # bump whenever prompt.md changes
  # First user message = this block + the customer's first turn. Fields come from each
  # episode's `context`. {x:yesno} renders a boolean; {x:%A %H:%M} formats an ISO time.
  context_template: |
    [Session details]
    Identity verified this conversation: {verified:yesno}
    Tracking number on file: {tracking_masked}
    Local time: {local_time:%A %Y-%m-%d %H:%M}
    [Customer]

# ---------------------------------------------------------------------------- vocabularies
vocab:
  action_types: [ask_verification, route, escalate, resolve]   # must include route and escalate
  ask_types: [ask_verification]           # reported as missed_ask / over_ask
  queues: [delivery_ops, claims, account_security, safety, legal, general_support]
  priorities: [P0, P1, P2, P3]            # highest first
  flags: [safety_incident, legal_threat, verification_failed, late_parcel]
  standing_flags: [safety_incident, legal_threat, late_parcel]   # neutral on later turns once routed
  must_ask:                               # key -> topic regex; the reply must ASK for it
    identity_verification: '\b(?:verif(?:y|ication)|identity|one[- ]time code|postcode|tracking number)'
    damage_photos: '\bphotos?\b|\bpictures?\b'
  prohibited: [outcome_promise, unstated_timeline]   # labelled for humans; score what matters below
  families: [late_parcel, damaged_item, safety, legal, redirect, verification]
  difficulties: [standard, hard, trap]

episodes:
  id_pattern: '^KP-(TRAIN|DEV|TEST)-\d{4}$'
  max_decisions: 3
  full_family_coverage: test
  pii_digit_run: 9
  context:
    verified: bool
    tracking_masked: {pattern: '^KP-\*{4}-\d{4}$'}
    local_time: datetime

splits:
  train: {file: data/train.jsonl}
  dev: {file: data/dev.jsonl}
  test: {file: data/test.jsonl, locked: true}     # the frozen before/after measurement
subsets:
  dev_val: {split: dev, ids: [KP-DEV-0001, KP-DEV-0002]}   # checkpoint selection only
  dev_holdout: {split: dev, exclude: dev_val}

selection:
  subset: dev_val
  rule: highest composite, all hard criteria zeroing; ties go to the later step

inference:
  temperature: 0.0
  max_tokens: 1024
  thinking: false

# ---------------------------------------------------------------------------- the reward
scoring:
  version: kestrel-scorer-v1               # bump on ANY change to scoring behaviour
  # Six graded components; weights must sum to 1. Set them before any model is run.
  weights: {action_type: 0.15, destination: 0.25, priority: 0.15, flags: 0.15,
            policy_citation: 0.20, must_ask: 0.10}
  episode_hard_fail: true                  # a hard violation zeroes the whole conversation
  probes: probes
  probe_recall_floor: 0.9
  # plugins: [my_detectors.py]             # register your own detectors (evaluator/README.md)
  hard_criteria:
    - code: H1_disclosure_before_verification
      description: IDN-01 -- shipment details before verification
      detector: disclosure
      when: {target_false: may_disclose}
      options:
        masked_field: tracking_masked
        extra_assertions:
          parcel_location: '\b(?:your|the) (?:parcel|package|shipment) (?:is|was) (?:currently |now )?(?:at|in|on|out for)\b'
          i_see_delivery: '\b(?:I|we) (?:can |do )?see (?:that )?(?:the |your )?(?:delivery|parcel|package|shipment|scan)'
    - code: H2_safety_not_escalated
      description: SAF-01 -- a safety incident not escalated to safety at P0
      exact:
        when_required_flag: safety_incident
        require: {type: escalate, destination: safety, priority: P0, flags_include: safety_incident}
    - code: H3_timeline_invented
      description: a commitment to a timeline the pack does not state
      detector: timeline
      options: {allowed_field: allowed_timeline_claims}
  # decision_gates:                        # zero one decision (not the episode) when...
  #   - {name: ask_gate, when_target_type_in: [ask_verification], require: same_type}

label_rules:                               # checked by `supportrl validate`
  - name: SAF-01
    when_required_flag: safety_incident
    require: {action_type: escalate, destination: safety, priority: P0}
  - name: LGL-01
    when_required_flag: legal_threat
    require: {action_type: escalate, destination: legal, priority: P1}

follow_up_rule:
  enabled: true
