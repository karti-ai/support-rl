# The run config that trained Karti-Small-Support-9B v1 (hosted LoRA RL, 2026-09-29), with the
# environment id replaced by the one `supportrl train --backend prime` builds for this example.
# Regenerate an equivalent with:
#   supportrl train examples/zoomberg --backend prime --model Qwen/Qwen3.5-9B --owner <hub-user>
# (the only difference is shuffle_seed, which v1 set to 20260929; pass it through the TOML).
#
# Effective values read back after the run: LoRA rank 16 (from adapter_config.json; the run API
# does not expose it), alpha 16, lr 1e-4. Adapted modules: q/k/v/o on the 8 full-attention layers
# and gate/up/down on all 32 layers; the linear-attention projections are not adapted.
# Cost: estimate $8.21, actual $5.45 of training (8.02M training tokens, 13.4M/254K inference).
name = "zoomberg-qwen3.5-9b-lora-v1"
model = "Qwen/Qwen3.5-9B"
loss = "rl"

# 56 train episodes: 8 episodes x 8 rollouts = 64 rollouts per step, so one epoch is 7 steps.
max_steps = 21
batch_size = 64
rollouts_per_example = 8
max_inflight_rollouts = 64
learning_rate = 1e-4
lora_alpha = 16

[sampling]
temperature = 1.0
# Baseline completion tokens per decision (thinking off): 4B max 158, 9B max 247.
max_tokens = 512
enable_thinking = false

[[env]]
id = "<hub-user>/zoomberg-support-triage@0.1.0"
# 8 shuffled passes (448 tasks) >= 2.6x the 168 that 21 steps x 8 groups consume.
args = { split = "train", repeats = 8, shuffle_seed = 20260929 }

[eval]
interval = 7
num_examples = -1
rollouts_per_example = 1
skip_first_step = false

[eval.sampling]
temperature = 0.0
max_tokens = 512
enable_thinking = false

[[eval.env]]
id = "<hub-user>/zoomberg-support-triage@0.1.0"
args = { split = "dev_val" }

[checkpoints]
interval = 7
keep_cloud = 3

[adapters]
interval = 7
keep_last = -1
